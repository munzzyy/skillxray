name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no install needed)
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke-test the CLI end to end
        run: |
          python -m skillxray tests/corpus/benign/weather --fail-on high
          python -m skillxray tests/corpus/malicious/cookie-stealer --json --fail-on none

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7 rejects the $/ self-repository form, so these stay on ./
      - name: Run the action on a clean skill
        id: clean
        uses: ./ # zizmor: ignore[self-repository]
        with:
          path: tests/corpus/benign/weather
          upload-sarif: "false"
      - name: Run the action on a malicious skill
        id: malicious
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          path: tests/corpus/malicious/cookie-stealer
          upload-sarif: "false"
      - name: Run the action on a path that does not exist
        id: missing
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          path: tests/corpus/no-such-skill
          upload-sarif: "false"
      - name: Check each result
        env:
          CLEAN: ${{ steps.clean.outputs.result }}
          MALICIOUS: ${{ steps.malicious.outputs.result }}
          MALICIOUS_OUTCOME: ${{ steps.malicious.outcome }}
          MISSING: ${{ steps.missing.outputs.result }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          echo "clean=$CLEAN malicious=$MALICIOUS/$MALICIOUS_OUTCOME missing=$MISSING/$MISSING_OUTCOME"
          test "$CLEAN" = pass
          test "$MALICIOUS" = fail
          test "$MALICIOUS_OUTCOME" = failure
          test "$MISSING" = error
          test "$MISSING_OUTCOME" = failure
