name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          package=$(python -c 'import skillxray; print(skillxray.__version__)')
          if [ "$tag" != "$project" ] || [ "$tag" != "$package" ]; then
            echo "::error::release $GITHUB_REF_NAME, but pyproject.toml says $project and skillxray/__init__.py says $package"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import skillxray"
          /tmp/v/bin/skillxray --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
